name: release

on:
  pull_request:
    types:
      - closed
    branches:
      - main
jobs:
  release:
    name: Release
    # `closed` fires for both merged and abandoned pull requests. Without this
    # guard, closing a pull request *without* merging it still bumps the
    # version and pushes a tag for code that never reached main.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
          WITH_V: true
          RELEASE_BRANCHES: main
          DEFAULT_BUMP: minor
